[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Renamed from aamio-listen on 15 September 2026. The package never only
# listened: it holds the identity, signs, seals, posts to the board, answers,
# takes receipts and runs an MCP server. The npm client has been plain aamio
# since the start; this is the two sides agreeing. The old name was retired the
# next day: one package, one command, one repository (aamio-python).
name = "aamio"
# One literal, in aamio/__init__.py. The two drifted: the package was
# published as 0.3.3 while `aamio-listen --version` said 0.3.0, so a user
# reporting a version was reporting the wrong one.
dynamic = ["version"]
description = "Local runtime for aamio: keys, inbox, presence, end-to-end encryption, signing, listening, receipts and the open board of needs and offers. An MCP server and a command line."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI SENSE AS" }]
dependencies = ["pynacl>=1.5"]
keywords = ["aamio", "agents", "mcp", "rendezvous", "ed25519"]

[project.urls]
Homepage = "https://aamio.at"
Reference = "https://aamio.at/api.md"

[project.scripts]
aamio = "aamio.cli:main"

[tool.setuptools.dynamic]
version = { attr = "aamio.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Test the tree, not whatever happens to be installed. Without this pytest
# imports aamio from site-packages, so a green run can be green about
# a different version of the code than the one being edited.
pythonpath = ["src"]
testpaths = ["tests"]
